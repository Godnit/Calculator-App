<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>حاسبتي</title><style>
:root{--bg:#0b1220;--panel:#121c2e;--key:#1b2940;--muted:#9aa9c2;--text:#f6f8fc;--accent:#5b8cff;--danger:#fb7185;--eq:#2f6df6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,#1c3c75 0%,var(--bg) 55%);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial;color:var(--text);display:flex;justify-content:center}.app{width:min(480px,100%);padding:20px 16px 28px;display:flex;flex-direction:column;gap:14px}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.logo{height:38px;width:38px;border-radius:12px;background:linear-gradient(135deg,#6ea0ff,#3768e8);display:grid;place-items:center;font-size:22px;font-weight:800}.title{font-weight:800;font-size:20px}.sub{color:var(--muted);font-size:12px}.icon{border:0;background:transparent;color:var(--muted);font-size:21px;padding:7px;cursor:pointer}.screen{background:rgba(18,28,46,.9);border:1px solid rgba(255,255,255,.07);border-radius:24px;padding:18px 18px 20px;text-align:left;direction:ltr;box-shadow:0 14px 40px #0003}.historyline{height:24px;color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.display{height:66px;display:flex;align-items:end;justify-content:end;font-size:44px;font-weight:700;letter-spacing:.5px;overflow:hidden}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.key{border:0;border-radius:17px;background:var(--key);color:var(--text);min-height:62px;font-size:22px;font-weight:650;cursor:pointer;transition:transform .08s,filter .15s}.key:active{transform:scale(.96);filter:brightness(1.3)}.op{color:#a9c2ff;background:#20365b}.danger{color:#ff9aac;background:#442333}.equals{background:linear-gradient(135deg,#4c82ff,#2f60df);grid-row:span 2}.zero{grid-column:span 2}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tool{border:1px solid #ffffff13;border-radius:12px;background:#ffffff08;color:var(--muted);padding:10px 4px;font-size:13px;cursor:pointer}.panel{display:none;background:var(--panel);border:1px solid #ffffff12;border-radius:18px;padding:14px}.panel.open{display:block}.panel h3{margin:0 0 10px;font-size:15px}.history{display:flex;flex-direction:column;gap:8px;max-height:180px;overflow:auto}.item{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;direction:ltr}.item b{color:var(--text)}.empty{color:var(--muted);font-size:13px;text-align:center;padding:12px}footer{text-align:center;color:#6f7e96;font-size:11px;margin-top:3px}@media(max-height:650px){.key{min-height:50px}.display{height:52px;font-size:36px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">＋</div><div><div class="title">حاسبتي</div><div class="sub">آلة حاسبة سريعة وبسيطة</div></div></div><button class="icon" id="historyBtn" aria-label="السجل">◷</button></header><section class="screen"><div class="historyline" id="expression">&nbsp;</div><div class="display" id="display">0</div></section><section class="tools"><button class="tool" data-fn="sqrt">√ جذر</button><button class="tool" data-fn="square">x² تربيع</button><button class="tool" data-fn="percent">% نسبة</button><button class="tool" data-fn="sign">± إشارة</button></section><section class="keys"><button class="key danger" data-key="clear">مسح</button><button class="key op" data-key="back">⌫</button><button class="key op" data-key="(">(</button><button class="key op" data-key=")">)</button><button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button><button class="key op" data-key="÷">÷</button><button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button><button class="key op" data-key="×">×</button><button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button><button class="key op" data-key="−">−</button><button class="key zero" data-key="0">0</button><button class="key" data-key=".">.</button><button class="key op" data-key="+">+</button><button class="key equals" data-key="=">=</button></section><section class="panel" id="historyPanel"><h3>السجل</h3><div class="history" id="history"></div></section><footer>يعمل بدون إنترنت • حاسبتي</footer></main><script>
const d=document.getElementById('display'),e=document.getElementById('expression'),histEl=document.getElementById('history'),panel=document.getElementById('historyPanel');let input='';let history=JSON.parse(localStorage.getItem('calc-history')||'[]');
function render(){d.textContent=input||'0'}function add(v){if(input==='خطأ')input='';input+=v;render()}function clear(){input='';e.innerHTML='&nbsp;';render()}function evaluate(){if(!input)return;try{let expr=input.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-').replace(/[^0-9+*/().\-\s]/g,'');if(!expr||/[+*/.-]$/.test(expr))return;let result=Function('"use strict";return ('+expr+')')();if(!Number.isFinite(result))throw Error();result=Math.round((result+Number.EPSILON)*1e12)/1e12;let old=input;input=String(result);e.textContent=old+' =';history.unshift({q:old,a:input});history=history.slice(0,20);localStorage.setItem('calc-history',JSON.stringify(history));render();renderHistory()}catch{input='خطأ';render()}}function renderHistory(){histEl.innerHTML=history.length?history.map(x=>`<div class="item"><span>${x.q}</span><b>${x.a}</b></div>`).join(''):'<div class="empty">لا توجد عمليات بعد</div>'}function fn(f){let n=Number(input);if(!Number.isFinite(n))return;if(f==='sqrt')input=String(Math.sqrt(n));if(f==='square')input=String(n*n);if(f==='percent')input=String(n/100);if(f==='sign')input=String(-n);render()}document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{let k=b.dataset.key;if(k==='clear')clear();else if(k==='back'){input=input.slice(0,-1);render()}else if(k==='=')evaluate();else add(k)});document.querySelectorAll('[data-fn]').forEach(b=>b.onclick=()=>fn(b.dataset.fn));document.getElementById('historyBtn').onclick=()=>{panel.classList.toggle('open');renderHistory()};document.addEventListener('keydown',x=>{let m={'*':'×','/':'÷','-':'−','Enter':'=','Escape':'clear','Backspace':'back'};let k=m[x.key]||x.key;if('0123456789.+−×÷()'.includes(k))add(k);else if(k==='=')evaluate();else if(k==='clear')clear();else if(k==='back'){input=input.slice(0,-1);render()}});render();renderHistory();
</script></body></html>
