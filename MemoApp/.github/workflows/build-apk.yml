name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'MemoApp/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MemoApp
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: memo-app-apk
          path: MemoApp/build/app/outputs/flutter-apk/app-release.apk
