name: Build Naqra APK

on:
  push:
    branches:
      - naqra-build
    paths:
      - 'NaqraApp/**'
      - '.github/workflows/build-naqra-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p NaqraApp assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: naqra-debug-apk
          path: NaqraApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish test APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: naqra-test-v1
          target_commitish: naqra-build
          name: نقرة - نسخة تجريبية
          body: |
            نسخة تجريبية من تطبيق نقرة (Naqra).
            تطبيق عداد عربي يعمل دون إنترنت ويحفظ العدد على الجهاز.
            هذا إصدار debug للاختبار الشخصي.
          files: NaqraApp/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: false
