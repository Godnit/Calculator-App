name: Build Hasibati APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Create signing key
        run: keytool -genkeypair -v -keystore app/release.keystore -storepass naffith-build -keypass naffith-build -alias naffith -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Naffith, OU=App, O=Naffith, L=Local, S=Local, C=YE"
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: naffith-release-apk
          path: app/build/outputs/apk/release/app-release.apk
